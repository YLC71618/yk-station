<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>又又的任務</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2416A}a:hover{color:#9E2F52}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF8EF; font-family: 'Noto Sans TC', sans-serif; color: #4A2C22; display: flex; flex-direction: column; overflow: hidden; position: relative">

<div style="display: flex; align-items: center; gap: 12px; padding: 18px 20px 0">
<a href="Main.dc.html" aria-label="回病房" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; border: 2px solid #8A4B36; box-sizing: border-box; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A2C22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<div style="display: flex; flex-direction: column; flex: 1">
<span style="font-size: 12px; font-weight: 700; color: #C2416A">又又的分頁</span>
<span style="font-size: 20px; font-weight: 900">我的任務</span>
</div>
<span style="font-family: Fredoka, sans-serif; font-size: 15px; font-weight: 700; background: #FFE7EC; color: #C2416A; border: 2px solid #C2416A; border-radius: 999px; padding: 3px 12px">{{coins}} 站幣</span>
</div>

<sc-if value="{{showToast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="margin: 10px 20px 0; background: #4A2C22; color: #FFFFFF; border-radius: 14px; padding: 9px 14px; font-size: 13px; font-weight: 700">{{toast}}</div>
</sc-if>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 12px">

<sc-if value="{{request}}" hint-placeholder-val="{{ true }}">
<div style="background: #2F63A6; color: #FFFFFF; border-radius: 20px; padding: 14px; border: 2px solid #8A4B36; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
<span style="font-size: 16px; font-weight: 900">鍇鍇叫你喝水！</span>
</div>
<span style="font-size: 13px; color: #DCE9F8">喝幾口也可以，拍照給他看就算數</span>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{openCam}}" style="flex: 1; height: 44px; border-radius: 14px; border: none; background: #FFFFFF; color: #2F63A6; font-family: 'Noto Sans TC', sans-serif; font-size: 14px; font-weight: 900; cursor: pointer">去拍照喝水</button>
<button type="button" onClick="{{snooze}}" style="flex: 1; height: 44px; border-radius: 14px; border: 2px solid #FFFFFF; background: transparent; color: #FFFFFF; font-family: 'Noto Sans TC', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer">我很飽，等等再喝（剩 {{snoozeLeft}} 次）</button>
</div>
</div>
</sc-if>

<div style="background: #FFFFFF; border: 2px solid #8A4B36; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 17px; font-weight: 900">今天的喝水</span>
<span style="font-family: Fredoka, sans-serif; font-size: 22px; font-weight: 700; color: #2F63A6">{{cups}} <span style="font-size: 14px; color: #8F6F62">/ 8 杯</span></span>
</div>
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{drops}}" as="d" hint-placeholder-count="8">
<svg width="100%" height="30" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 3 C16 9 20 13 20 18.5 A8 8 0 0 1 4 18.5 C4 13 8 9 12 3 Z" fill="{{d.fill}}" stroke="#8A4B36" stroke-width="1.6"></path></svg>
</sc-for>
</div>
<sc-if value="{{hasPending}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 12px; color: #8F6F62">還有 {{pending}} 杯等鍇鍇核可</span>
</sc-if>
<button type="button" onClick="{{openCam}}" style="height: 48px; border-radius: 16px; border: 2px solid #8A4B36; background: #FFE7EC; color: #4A2C22; font-family: 'Noto Sans TC', sans-serif; font-size: 15px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A2C22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
我自己拍照喝水
</button>
</div>

<sc-if value="{{hasKylePending}}" hint-placeholder-val="{{ true }}">
<div style="background: #FFFFFF; border: 2px solid #C5DBF3; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 17px; font-weight: 900">審核鍇鍇的喝水</span>
<sc-for list="{{kylePending}}" as="k" hint-placeholder-count="1">
<div style="display: flex; align-items: center; gap: 10px">
<div style="display: flex; gap: 4px">
<svg width="40" height="48" viewBox="0 0 120 150" role="img" aria-label="滿杯照片"><rect x="0" y="0" width="120" height="150" rx="14" fill="#E9F2FC"></rect><path d="M30 20 L90 20 L82 130 L38 130 Z" fill="#FFFFFF" stroke="#8A4B36" stroke-width="5"></path><path d="M33 45 L87 45 L82 127 L38 127 Z" fill="#8FC0EE"></path></svg>
<svg width="40" height="48" viewBox="0 0 120 150" role="img" aria-label="空杯照片"><rect x="0" y="0" width="120" height="150" rx="14" fill="#E9F2FC"></rect><path d="M30 20 L90 20 L82 130 L38 130 Z" fill="#FFFFFF" stroke="#8A4B36" stroke-width="5"></path><path d="M37 116 L83 116 L82 127 L38 127 Z" fill="#8FC0EE"></path></svg>
</div>
<span style="flex: 1; font-size: 13px; color: #6B4A3E">{{k.time}} 傳來</span>
<button type="button" onClick="{{k.approve}}" style="height: 40px; padding: 0 12px; border-radius: 12px; border: none; background: #3F8A69; color: #FFFFFF; font-family: 'Noto Sans TC', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer">核可</button>
<button type="button" onClick="{{k.reject}}" style="height: 40px; padding: 0 12px; border-radius: 12px; border: 2px solid #8A4B36; background: #FFFFFF; color: #4A2C22; font-family: 'Noto Sans TC', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer">退回</button>
</div>
</sc-for>
</div>
</sc-if>

<div style="background: #FFFFFF; border: 2px solid #8A4B36; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column">
<span style="font-size: 17px; font-weight: 900">鍇鍇擦手手評分</span>
<span style="font-size: 12px; color: #8F6F62">他洗完手有沒有擦乾？他看得到分數</span>
</div>
<span style="font-family: Fredoka, sans-serif; font-size: 30px; font-weight: 700; color: #2F63A6">{{handScore}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" onClick="{{plus}}" style="height: 52px; border-radius: 16px; border: 2px solid #8A4B36; background: #DDF2E7; color: #2E6B50; font-family: 'Noto Sans TC', sans-serif; font-size: 15px; font-weight: 900; cursor: pointer">有擦乾 +1</button>
<button type="button" onClick="{{minus}}" style="height: 52px; border-radius: 16px; border: 2px solid #8A4B36; background: #FFE7EC; color: #C2416A; font-family: 'Noto Sans TC', sans-serif; font-size: 15px; font-weight: 900; cursor: pointer">沒擦乾 −1</button>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{handLog}}" as="h" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; font-size: 13px; padding: 4px 2px; border-bottom: 1px dashed #EED9C8">
<span style="color: #6B4A3E">{{h.time}}</span>
<span style="{{h.style}}">{{h.label}}</span>
</div>
</sc-for>
</div>
</div>

<button type="button" style="min-height: 52px; border-radius: 18px; border: 2px dashed #C9A893; background: transparent; color: #8F6F62; font-family: 'Noto Sans TC', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">＋ 新增我的任務</button>
</div>

<nav aria-label="主選單" style="flex-shrink: 0; margin: 0 14px 14px; position: relative; height: 84px">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: #FFFFFF; border: 2px solid #8A4B36; border-radius: 24px; box-sizing: border-box; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 4px">
<a href="Yoyo.dc.html" aria-current="page" style="height: 54px; background: #FFE7EC; border-radius: 16px; color: #C2416A; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700"><span style="width: 26px; height: 26px; border-radius: 50%; overflow: hidden; background: #FFE7EC; border: 1.5px solid #C2416A; box-sizing: border-box; display: block"><svg width="23" height="23" viewBox="18 8 64 64" aria-hidden="true"><g stroke="#8A4B36" stroke-width="2.4"><path d="M20 50 C17 24 33 11 50 11 C67 11 83 24 80 50 C80 62 85 74 81 86 L19 86 C15 74 20 62 20 50 Z" fill="#C47A55"></path><path d="M28.5 45 C28.5 33.5 38.5 28.5 50 28.5 C61.5 28.5 71.5 33.5 71.5 45 C73.5 56 71.5 67 64 73 C60 76.2 55 77.2 50 77.2 C45 77.2 40 76.2 36 73 C28.5 67 26.5 56 28.5 45 Z" fill="#FFEBDD"></path><path d="M26 50 C23 27 36 16 50 16 C64 16 77 27 74 50 C72.5 43.5 69.5 38.5 64 35.5 C61 40.5 55.5 43.5 49 44.5 C51 40.5 51 37.5 50 35.5 C45 40.5 38.5 44 31.5 46 C29 47 27.5 48.5 26 50 Z" fill="#C47A55"></path></g><circle cx="40" cy="56" r="3.4" fill="#4A2C22"></circle><circle cx="60" cy="56" r="3.4" fill="#4A2C22"></circle></svg></span>又又</a>
<a href="Food.dc.html" style="height: 54px; color: #6B4A3E; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6B4A3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M8 7c0-1.5 1-2 1-3.5"></path><path d="M12 7c0-1.5 1-2 1-3.5"></path><path d="M16 7c0-1.5 1-2 1-3.5"></path></svg>吃什麼</a>
<span aria-hidden="true"></span>
<a href="Shopping.dc.html" style="height: 54px; color: #6B4A3E; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6B4A3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2.5 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L22 7H6.2"></path></svg>清單</a>
<a href="Kyle.dc.html" style="height: 54px; color: #2F63A6; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700"><span style="width: 26px; height: 26px; border-radius: 50%; overflow: hidden; background: #E3EFFC; border: 1.5px solid #2F63A6; box-sizing: border-box; display: block"><svg width="23" height="23" viewBox="18 8 64 64" aria-hidden="true"><g stroke="#8A4B36" stroke-width="2.4"><path d="M28.5 45 C28.5 33.5 38.5 28.5 50 28.5 C61.5 28.5 71.5 33.5 71.5 45 C73.5 56 71.5 67 64 73 C60 76.2 55 77.2 50 77.2 C45 77.2 40 76.2 36 73 C28.5 67 26.5 56 28.5 45 Z" fill="#FFEBDD"></path><path d="M27 51 C23 30 34 17 50 17 C55 14 60 13.5 63 14.5 C61 15.5 60 16.5 59.5 18 C70 21 77 31 73.5 49 C72 44 70 40.5 67 38 C66 40.5 64 42 61.5 43 C62 40.5 61.5 38 60.5 36.5 C55 39.5 48.5 41.5 42 42.5 C43 40.5 43 38.5 42.5 37 C37 40.5 32 45 29 51 C28.5 50.5 27.8 50.5 27 51 Z" fill="#5A4038"></path></g><g stroke="#6B4A3E" stroke-width="2" fill="none"><circle cx="40.5" cy="56.5" r="7.8"></circle><circle cx="59.5" cy="56.5" r="7.8"></circle></g></svg></span>鍇鍇</a>
</div>
<a href="Main.dc.html" aria-label="病房" style="position: absolute; left: 50%; top: 0; margin-left: -40px; width: 80px; height: 80px; border-radius: 50%; background: #F7B6C2; border: 3px solid #8A4B36; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: #4A2C22; text-decoration: none; font-size: 12px; font-weight: 900"><svg width="38" height="34" viewBox="0 0 60 54" aria-hidden="true"><g stroke="#8A4B36" stroke-width="2.4"><circle cx="13" cy="13" r="8" fill="#E8B07A"></circle><circle cx="47" cy="13" r="8" fill="#E8B07A"></circle><circle cx="30" cy="30" r="22" fill="#E8B07A"></circle></g><circle cx="13" cy="13" r="4" fill="#F7C9C0"></circle><circle cx="47" cy="13" r="4" fill="#F7C9C0"></circle><ellipse cx="30" cy="38" rx="7.5" ry="5.5" fill="#FFE7C7"></ellipse><ellipse cx="30" cy="35.5" rx="2.4" ry="1.7" fill="#5A3A2E"></ellipse><circle cx="21" cy="30" r="2.4" fill="#4A2C22"></circle><circle cx="39" cy="30" r="2.4" fill="#4A2C22"></circle></svg>病房</a>
</nav>

<sc-if value="{{camOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-modal="true" aria-label="拍照喝水" style="position: absolute; inset: 0; z-index: 5; background: rgba(42, 26, 20, 0.92); display: flex; flex-direction: column; align-items: center; padding: 40px 24px 32px; box-sizing: border-box; gap: 16px; color: #FFFFFF">
<span style="font-size: 13px; font-weight: 700; color: #F7B6C2">{{camStepLabel}}</span>
<span style="font-size: 20px; font-weight: 900; text-align: center">{{camTitle}}</span>
<div style="width: 300px; height: 380px; border-radius: 24px; background: #1E1410; border: 3px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; position: relative">
<sc-if value="{{camFull}}" hint-placeholder-val="{{ true }}">
<svg width="150" height="190" viewBox="0 0 120 150" aria-hidden="true"><path d="M30 20 L90 20 L82 130 L38 130 Z" fill="none" stroke="#FFFFFF" stroke-width="4"></path><path d="M33 45 L87 45 L82 127 L38 127 Z" fill="#8FC0EE" opacity="0.85"></path></svg>
</sc-if>
<sc-if value="{{camEmpty}}" hint-placeholder-val="{{ false }}">
<svg width="150" height="190" viewBox="0 0 120 150" aria-hidden="true"><path d="M30 20 L90 20 L82 130 L38 130 Z" fill="none" stroke="#FFFFFF" stroke-width="4"></path><path d="M37 116 L83 116 L82 127 L38 127 Z" fill="#8FC0EE" opacity="0.85"></path></svg>
</sc-if>
<sc-if value="{{camSent}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px; text-align: center">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#8FD6B2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M8 12.5l3 3 5-6"></path></svg>
<span style="font-size: 16px; font-weight: 900">已送給鍇鍇審核</span>
<span style="font-size: 13px; color: #E9D9CF">他核可後 +5 站幣，熊熊水分 +10</span>
</div>
</sc-if>
<span style="position: absolute; top: 12px; left: 12px; font-size: 11px; color: #E9D9CF; background: rgba(0,0,0,0.4); border-radius: 999px; padding: 3px 10px">現場拍照 · 不能從相簿選</span>
</div>
<sc-if value="{{camShooting}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{shoot}}" aria-label="拍照" style="width: 74px; height: 74px; border-radius: 50%; border: 5px solid #FFFFFF; background: #F7B6C2; cursor: pointer"></button>
</sc-if>
<sc-if value="{{camSent}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{closeCam}}" style="width: 200px; height: 50px; border-radius: 25px; border: none; background: #FFFFFF; color: #4A2C22; font-family: 'Noto Sans TC', sans-serif; font-size: 15px; font-weight: 900; cursor: pointer">完成</button>
</sc-if>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      coins: 120, request: true, snoozeLeft: 2, cups: 3, pending: 1, cam: 0,
      kylePending: [{ id: 1, time: '14:20' }],
      handScore: 6,
      handLog: [{ d: 1, time: '今天 09:12' }, { d: -1, time: '昨天 22:40' }, { d: 1, time: '昨天 18:05' }],
      toast: ''
    };
  }
  componentWillUnmount() { clearTimeout(this._t); }
  say(msg) {
    this.setState({ toast: msg });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toast: '' }), 2400);
  }
  now() {
    const d = new Date();
    return '今天 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  score(delta) {
    const st = this.state;
    this.setState({ handScore: st.handScore + delta, handLog: [{ d: delta, time: this.now() }].concat(st.handLog).slice(0, 4) });
    this.say(delta > 0 ? '鍇鍇 +1，熊熊清潔度上升' : '鍇鍇 −1，熊熊的手手要龜裂了');
  }
  renderVals() {
    const st = this.state;
    const labels = ['', '第 1 步，共 2 步', '第 2 步，共 2 步', '完成'];
    const titles = ['', '拍一張有水的杯子', '喝完了，拍一張杯子', ''];
    return {
      coins: st.coins,
      request: st.request,
      snoozeLeft: st.snoozeLeft,
      cups: st.cups,
      drops: [0, 1, 2, 3, 4, 5, 6, 7].map((i) => ({ fill: i < st.cups ? '#8FC0EE' : (i < st.cups + st.pending ? '#DCE9F8' : '#FFFFFF') })),
      pending: st.pending,
      hasPending: st.pending > 0,
      kylePending: st.kylePending.map((k) => ({
        time: k.time,
        approve: () => { this.setState({ kylePending: this.state.kylePending.filter((x) => x.id !== k.id) }); this.say('已核可，鍇鍇 +5 站幣'); },
        reject: () => { this.setState({ kylePending: this.state.kylePending.filter((x) => x.id !== k.id) }); this.say('已退回，請鍇鍇重拍'); }
      })),
      hasKylePending: st.kylePending.length > 0,
      handScore: st.handScore,
      handLog: st.handLog.map((h) => ({ time: h.time, label: h.d > 0 ? '有擦乾 +1' : '沒擦乾 −1', style: 'font-weight: 700; color: ' + (h.d > 0 ? '#2E6B50' : '#C2416A') })),
      plus: () => this.score(1),
      minus: () => this.score(-1),
      openCam: () => this.setState({ cam: 1 }),
      shoot: () => {
        if (this.state.cam === 1) this.setState({ cam: 2 });
        else if (this.state.cam === 2) this.setState({ cam: 3, pending: this.state.pending + 1, request: false });
      },
      closeCam: () => this.setState({ cam: 0 }),
      snooze: () => {
        if (st.snoozeLeft <= 0) { this.say('今天的延後次數用完了，要喝囉'); return; }
        this.setState({ snoozeLeft: st.snoozeLeft - 1, request: false });
        this.say('好，30 分鐘後再提醒你');
      },
      camOpen: st.cam > 0,
      camStepLabel: labels[st.cam] || '',
      camTitle: titles[st.cam] || '',
      camFull: st.cam === 1,
      camEmpty: st.cam === 2,
      camSent: st.cam === 3,
      camShooting: st.cam === 1 || st.cam === 2,
      showToast: !!st.toast,
      toast: st.toast
    };
  }
}
</script>
</body>
</html>
