<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>鍇鍇的任務</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F63A6}a:hover{color:#234C82}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F9FE; font-family: 'Noto Sans TC', sans-serif; color: #4A2C22; display: flex; flex-direction: column; overflow: hidden; position: relative">

<div style="display: flex; align-items: center; gap: 12px; padding: 18px 20px 0">
<a href="Main.dc.html" aria-label="回病房" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; border: 2px solid #8A4B36; box-sizing: border-box; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A2C22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<div style="display: flex; flex-direction: column; flex: 1">
<span style="font-size: 12px; font-weight: 700; color: #2F63A6">鍇鍇的分頁</span>
<span style="font-size: 20px; font-weight: 900">我的任務</span>
</div>
<span style="font-family: Fredoka, sans-serif; font-size: 15px; font-weight: 700; background: #E3EFFC; color: #2F63A6; border: 2px solid #2F63A6; border-radius: 999px; padding: 3px 12px">{{coins}} 站幣</span>
</div>

<sc-if value="{{showToast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="margin: 10px 20px 0; background: #4A2C22; color: #FFFFFF; border-radius: 14px; padding: 9px 14px; font-size: 13px; font-weight: 700">{{toast}}</div>
</sc-if>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 12px">

<button type="button" onClick="{{pingYo}}" style="min-height: 64px; border-radius: 22px; border: 2px solid #8A4B36; background: #2F63A6; color: #FFFFFF; font-family: 'Noto Sans TC', sans-serif; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.7c3 3.6 6 7 6 10.3a6 6 0 0 1-12 0c0-3.3 3-6.7 6-10.3z"></path></svg>
<span style="display: flex; flex-direction: column; align-items: flex-start">
<span style="font-size: 17px; font-weight: 900">叫又又喝水</span>
<span style="font-size: 12px; color: #DCE9F8">她要拍照給你看才算數</span>
</span>
</button>

<sc-if value="{{hasYoPending}}" hint-placeholder-val="{{ true }}">
<div style="background: #FFFFFF; border: 2px solid #F3C6D2; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 17px; font-weight: 900">審核又又的喝水</span>
<sc-for list="{{yoPending}}" as="k" hint-placeholder-count="1">
<div style="display: flex; align-items: center; gap: 10px">
<div style="display: flex; gap: 4px">
<svg width="40" height="48" viewBox="0 0 120 150" role="img" aria-label="滿杯照片"><rect x="0" y="0" width="120" height="150" rx="14" fill="#FDEFF2"></rect><path d="M30 20 L90 20 L82 130 L38 130 Z" fill="#FFFFFF" stroke="#8A4B36" stroke-width="5"></path><path d="M33 45 L87 45 L82 127 L38 127 Z" fill="#8FC0EE"></path></svg>
<svg width="40" height="48" viewBox="0 0 120 150" role="img" aria-label="空杯照片"><rect x="0" y="0" width="120" height="150" rx="14" fill="#FDEFF2"></rect><path d="M30 20 L90 20 L82 130 L38 130 Z" fill="#FFFFFF" stroke="#8A4B36" stroke-width="5"></path><path d="M37 116 L83 116 L82 127 L38 127 Z" fill="#8FC0EE"></path></svg>
</div>
<span style="flex: 1; font-size: 13px; color: #6B4A3E">{{k.time}} 傳來</span>
<button type="button" onClick="{{k.approve}}" style="height: 40px; padding: 0 12px; border-radius: 12px; border: none; background: #3F8A69; color: #FFFFFF; font-family: 'Noto Sans TC', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer">核可</button>
<button type="button" onClick="{{k.reject}}" style="height: 40px; padding: 0 12px; border-radius: 12px; border: 2px solid #8A4B36; background: #FFFFFF; color: #4A2C22; font-family: 'Noto Sans TC', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer">退回</button>
</div>
</sc-for>
</div>
</sc-if>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{chores}}" as="c" hint-placeholder-count="2">
<div style="background: #FFFFFF; border: 2px solid #8A4B36; border-radius: 22px; padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center">
<span style="font-size: 15px; font-weight: 900">{{c.label}}</span>
<div style="{{c.ringStyle}}">
<span style="font-family: Fredoka, sans-serif; font-size: 26px; font-weight: 700; color: #2F63A6; line-height: 1">{{c.left}}</span>
<span style="font-size: 11px; color: #6B4A3E">天後要做</span>
</div>
<span style="font-size: 11px; color: #8F6F62">每 {{c.every}} 天一次</span>
<button type="button" onClick="{{c.done}}" style="width: 100%; height: 42px; border-radius: 14px; border: 2px solid #8A4B36; background: #E3EFFC; color: #2F63A6; font-family: 'Noto Sans TC', sans-serif; font-size: 14px; font-weight: 900; cursor: pointer">{{c.doneLabel}}</button>
</div>
</sc-for>
</div>

<div style="background: #FFFFFF; border: 2px solid #8A4B36; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 17px; font-weight: 900">我的喝水</span>
<span style="font-family: Fredoka, sans-serif; font-size: 22px; font-weight: 700; color: #2F63A6">{{cups}} <span style="font-size: 14px; color: #8F6F62">/ 8 杯</span></span>
</div>
<button type="button" onClick="{{drink}}" style="height: 48px; border-radius: 16px; border: 2px solid #8A4B36; background: #E3EFFC; color: #4A2C22; font-family: 'Noto Sans TC', sans-serif; font-size: 15px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A2C22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
拍照喝水（給又又審核）
</button>
</div>

<div style="background: #FFFFFF; border: 2px solid #8A4B36; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column">
<span style="font-size: 17px; font-weight: 900">我的擦手手分數</span>
<span style="font-size: 12px; color: #8F6F62">又又幫你打的分，只能看不能改</span>
</div>
<span style="font-family: Fredoka, sans-serif; font-size: 30px; font-weight: 700; color: #2F63A6">6</span>
</div>
<div style="display: flex; justify-content: space-between; font-size: 13px; padding: 4px 2px; border-bottom: 1px dashed #DCE6F2"><span style="color: #6B4A3E">今天 09:12</span><span style="font-weight: 700; color: #2E6B50">有擦乾 +1</span></div>
<div style="display: flex; justify-content: space-between; font-size: 13px; padding: 4px 2px; border-bottom: 1px dashed #DCE6F2"><span style="color: #6B4A3E">昨天 22:40</span><span style="font-weight: 700; color: #C2416A">沒擦乾 −1</span></div>
</div>

<button type="button" style="min-height: 52px; border-radius: 18px; border: 2px dashed #9DB6D6; background: transparent; color: #5B7090; font-family: 'Noto Sans TC', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">＋ 新增我的任務</button>
</div>

<nav aria-label="主選單" style="flex-shrink: 0; margin: 0 14px 14px; position: relative; height: 84px">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: #FFFFFF; border: 2px solid #8A4B36; border-radius: 24px; box-sizing: border-box; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 4px">
<a href="Yoyo.dc.html" style="height: 54px; color: #C2416A; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700"><span style="width: 26px; height: 26px; border-radius: 50%; overflow: hidden; background: #FFE7EC; border: 1.5px solid #C2416A; box-sizing: border-box; display: block"><svg width="23" height="23" viewBox="18 8 64 64" aria-hidden="true"><g stroke="#8A4B36" stroke-width="2.4"><path d="M20 50 C17 24 33 11 50 11 C67 11 83 24 80 50 C80 62 85 74 81 86 L19 86 C15 74 20 62 20 50 Z" fill="#C47A55"></path><path d="M28.5 45 C28.5 33.5 38.5 28.5 50 28.5 C61.5 28.5 71.5 33.5 71.5 45 C73.5 56 71.5 67 64 73 C60 76.2 55 77.2 50 77.2 C45 77.2 40 76.2 36 73 C28.5 67 26.5 56 28.5 45 Z" fill="#FFEBDD"></path><path d="M26 50 C23 27 36 16 50 16 C64 16 77 27 74 50 C72.5 43.5 69.5 38.5 64 35.5 C61 40.5 55.5 43.5 49 44.5 C51 40.5 51 37.5 50 35.5 C45 40.5 38.5 44 31.5 46 C29 47 27.5 48.5 26 50 Z" fill="#C47A55"></path></g><circle cx="40" cy="56" r="3.4" fill="#4A2C22"></circle><circle cx="60" cy="56" r="3.4" fill="#4A2C22"></circle></svg></span>又又</a>
<a href="Food.dc.html" style="height: 54px; color: #6B4A3E; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6B4A3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M8 7c0-1.5 1-2 1-3.5"></path><path d="M12 7c0-1.5 1-2 1-3.5"></path><path d="M16 7c0-1.5 1-2 1-3.5"></path></svg>吃什麼</a>
<span aria-hidden="true"></span>
<a href="Shopping.dc.html" style="height: 54px; color: #6B4A3E; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6B4A3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2.5 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L22 7H6.2"></path></svg>清單</a>
<a href="Kyle.dc.html" aria-current="page" style="height: 54px; background: #E3EFFC; border-radius: 16px; color: #2F63A6; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700"><span style="width: 26px; height: 26px; border-radius: 50%; overflow: hidden; background: #E3EFFC; border: 1.5px solid #2F63A6; box-sizing: border-box; display: block"><svg width="23" height="23" viewBox="18 8 64 64" aria-hidden="true"><g stroke="#8A4B36" stroke-width="2.4"><path d="M28.5 45 C28.5 33.5 38.5 28.5 50 28.5 C61.5 28.5 71.5 33.5 71.5 45 C73.5 56 71.5 67 64 73 C60 76.2 55 77.2 50 77.2 C45 77.2 40 76.2 36 73 C28.5 67 26.5 56 28.5 45 Z" fill="#FFEBDD"></path><path d="M27 51 C23 30 34 17 50 17 C55 14 60 13.5 63 14.5 C61 15.5 60 16.5 59.5 18 C70 21 77 31 73.5 49 C72 44 70 40.5 67 38 C66 40.5 64 42 61.5 43 C62 40.5 61.5 38 60.5 36.5 C55 39.5 48.5 41.5 42 42.5 C43 40.5 43 38.5 42.5 37 C37 40.5 32 45 29 51 C28.5 50.5 27.8 50.5 27 51 Z" fill="#5A4038"></path></g><g stroke="#6B4A3E" stroke-width="2" fill="none"><circle cx="40.5" cy="56.5" r="7.8"></circle><circle cx="59.5" cy="56.5" r="7.8"></circle></g></svg></span>鍇鍇</a>
</div>
<a href="Main.dc.html" aria-label="病房" style="position: absolute; left: 50%; top: 0; margin-left: -40px; width: 80px; height: 80px; border-radius: 50%; background: #F7B6C2; border: 3px solid #8A4B36; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: #4A2C22; text-decoration: none; font-size: 12px; font-weight: 900"><svg width="38" height="34" viewBox="0 0 60 54" aria-hidden="true"><g stroke="#8A4B36" stroke-width="2.4"><circle cx="13" cy="13" r="8" fill="#E8B07A"></circle><circle cx="47" cy="13" r="8" fill="#E8B07A"></circle><circle cx="30" cy="30" r="22" fill="#E8B07A"></circle></g><circle cx="13" cy="13" r="4" fill="#F7C9C0"></circle><circle cx="47" cy="13" r="4" fill="#F7C9C0"></circle><ellipse cx="30" cy="38" rx="7.5" ry="5.5" fill="#FFE7C7"></ellipse><ellipse cx="30" cy="35.5" rx="2.4" ry="1.7" fill="#5A3A2E"></ellipse><circle cx="21" cy="30" r="2.4" fill="#4A2C22"></circle><circle cx="39" cy="30" r="2.4" fill="#4A2C22"></circle></svg>病房</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { coins: 85, cups: 2, shave: 1, nails: 5, yoPending: [{ id: 1, time: '15:05' }], toast: '' };
  }
  componentWillUnmount() { clearTimeout(this._t); }
  say(msg) {
    this.setState({ toast: msg });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toast: '' }), 2400);
  }
  renderVals() {
    const st = this.state;
    const ring = (left, every) => {
      const pct = Math.round((left / every) * 100);
      const color = left <= 1 ? '#C2416A' : '#6FA8E6';
      return 'width: 88px; height: 88px; border-radius: 50%; background: conic-gradient(' + color + ' 0 ' + pct + '%, #EEF3FA ' + pct + '% 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: inset 0 0 0 10px #FFFFFF; border: 2px solid #8A4B36; box-sizing: border-box';
    };
    const chores = [
      { key: 'shave', label: '刮鬍子', left: st.shave, every: 3 },
      { key: 'nails', label: '剪指甲', left: st.nails, every: 9 }
    ].map((c) => ({
      label: c.label, left: c.left, every: c.every,
      ringStyle: ring(c.left, c.every),
      doneLabel: '完成了 +5',
      done: () => {
        const upd = { coins: this.state.coins + 5 };
        upd[c.key] = c.every;
        this.setState(upd);
        this.say(c.label + '完成！+5 站幣，' + c.every + ' 天後再提醒你');
      }
    }));
    return {
      coins: st.coins,
      cups: st.cups,
      chores: chores,
      yoPending: st.yoPending.map((k) => ({
        time: k.time,
        approve: () => { this.setState({ yoPending: this.state.yoPending.filter((x) => x.id !== k.id) }); this.say('已核可，又又 +5 站幣，熊熊水分 +10'); },
        reject: () => { this.setState({ yoPending: this.state.yoPending.filter((x) => x.id !== k.id) }); this.say('已退回，請又又重拍'); }
      })),
      hasYoPending: st.yoPending.length > 0,
      pingYo: () => this.say('已通知又又！她的手機會跳出喝水提醒'),
      drink: () => this.say('（正式版會開相機：拍滿杯 → 拍空杯 → 送給又又審核）'),
      showToast: !!st.toast,
      toast: st.toast
    };
  }
}
</script>
</body>
</html>
