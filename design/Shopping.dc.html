<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>購物清單</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2416A}a:hover{color:#9E1C4A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF8EF; font-family: 'Noto Sans TC', sans-serif; color: #4A2C22; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px; padding: 20px 20px 0">
<a href="Main.dc.html" aria-label="回病房" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; border: 2px solid #EED9C8; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A2C22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<div style="display: flex; flex-direction: column">
<span style="font-size: 12px; font-weight: 700; color: #2F63A6">兩人共用</span>
<span style="font-size: 20px; font-weight: 900">購物清單</span>
</div>
</div>

<div style="margin: 16px 20px 0; background: #FFFFFF; border-radius: 16px; padding: 4px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; border: 2px solid #EED9C8">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>

<div style="margin: 14px 20px 0; background: #FFFFFF; border-radius: 18px; padding: 12px; border: 2px solid #EED9C8; display: flex; flex-direction: column; gap: 10px">
<label for="new-item" style="font-size: 13px; font-weight: 700; color: #4A2C22">新增項目</label>
<div style="display: flex; gap: 8px">
<input id="new-item" type="text" value="{{draft}}" onChange="{{onDraft}}" placeholder="例如：雞蛋" style="flex: 1; min-width: 0; height: 46px; box-sizing: border-box; border: 2px solid #EED9C8; border-radius: 12px; padding: 0 12px; font-family: 'Noto Sans TC', sans-serif; font-size: 15px; color: #4A2C22; background: #FFFCF8">
<button type="button" onClick="{{add}}" aria-label="新增" style="width: 46px; height: 46px; border: none; border-radius: 12px; background: #2F63A6; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
</button>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 12px; color: #8F6F62">誰加的：</span>
<sc-for list="{{owners}}" as="o" hint-placeholder-count="2">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="{{o.style}}">{{o.label}}</button>
</sc-for>
</div>
</div>

<div style="margin: 14px 20px 0; display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 15px; font-weight: 900">還要買</span>
<span style="font-family: Fredoka, sans-serif; font-size: 13px; color: #2F63A6">{{doneText}}</span>
</div>

<div style="margin: 8px 20px 0; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overflow-y: auto">
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<div style="background: #FFFFFF; border-radius: 14px; padding: 0 12px; min-height: 52px; display: flex; align-items: center; gap: 10px">
<input type="checkbox" id="{{it.cid}}" checked="{{it.done}}" onChange="{{it.toggle}}" style="width: 22px; height: 22px; accent-color: #C2416A; flex-shrink: 0; margin: 0">
<label for="{{it.cid}}" style="{{it.nameStyle}}">{{it.name}}</label>
<span style="{{it.tagStyle}}">{{it.by}}</span>
</div>
</sc-for>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<div style="background: #FFFFFF; border-radius: 14px; padding: 14px; font-size: 13px; color: #8F6F62; border: 2px dashed #EED9C8">清單是空的，從上面加一個吧</div>
</sc-if>
</div>

<button type="button" onClick="{{clearDone}}" style="margin: 10px 20px 8px; height: 46px; border-radius: 25px; border: 2px solid #C2416A; background: #FFFFFF; color: #C2416A; font-family: 'Noto Sans TC', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">清除已買的</button>

<nav aria-label="主選單" style="flex-shrink: 0; margin: 0 14px 14px; position: relative; height: 84px">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: #FFFFFF; border: 2px solid #8A4B36; border-radius: 24px; box-sizing: border-box; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 4px">
<a href="Yoyo.dc.html" style="height: 54px; color: #C2416A; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700"><span style="width: 26px; height: 26px; border-radius: 50%; overflow: hidden; background: #FFE7EC; border: 1.5px solid #C2416A; box-sizing: border-box; display: block"><svg width="23" height="23" viewBox="18 8 64 64" aria-hidden="true"><g stroke="#8A4B36" stroke-width="2.4"><path d="M20 50 C17 24 33 11 50 11 C67 11 83 24 80 50 C80 62 85 74 81 86 L19 86 C15 74 20 62 20 50 Z" fill="#C47A55"></path><path d="M28.5 45 C28.5 33.5 38.5 28.5 50 28.5 C61.5 28.5 71.5 33.5 71.5 45 C73.5 56 71.5 67 64 73 C60 76.2 55 77.2 50 77.2 C45 77.2 40 76.2 36 73 C28.5 67 26.5 56 28.5 45 Z" fill="#FFEBDD"></path><path d="M26 50 C23 27 36 16 50 16 C64 16 77 27 74 50 C72.5 43.5 69.5 38.5 64 35.5 C61 40.5 55.5 43.5 49 44.5 C51 40.5 51 37.5 50 35.5 C45 40.5 38.5 44 31.5 46 C29 47 27.5 48.5 26 50 Z" fill="#C47A55"></path></g><circle cx="40" cy="56" r="3.4" fill="#4A2C22"></circle><circle cx="60" cy="56" r="3.4" fill="#4A2C22"></circle></svg></span>又又</a>
<a href="Food.dc.html" style="height: 54px; color: #6B4A3E; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6B4A3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0z"></path><path d="M8 7c0-1.5 1-2 1-3.5"></path><path d="M12 7c0-1.5 1-2 1-3.5"></path><path d="M16 7c0-1.5 1-2 1-3.5"></path></svg>吃什麼</a>
<span aria-hidden="true"></span>
<a href="Shopping.dc.html" aria-current="page" style="height: 54px; background: #FFF1DE; border-radius: 16px; color: #4A2C22; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 900"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4A2C22" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2.5 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L22 7H6.2"></path></svg>清單</a>
<a href="Kyle.dc.html" style="height: 54px; color: #2F63A6; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700"><span style="width: 26px; height: 26px; border-radius: 50%; overflow: hidden; background: #E3EFFC; border: 1.5px solid #2F63A6; box-sizing: border-box; display: block"><svg width="23" height="23" viewBox="18 8 64 64" aria-hidden="true"><g stroke="#8A4B36" stroke-width="2.4"><path d="M28.5 45 C28.5 33.5 38.5 28.5 50 28.5 C61.5 28.5 71.5 33.5 71.5 45 C73.5 56 71.5 67 64 73 C60 76.2 55 77.2 50 77.2 C45 77.2 40 76.2 36 73 C28.5 67 26.5 56 28.5 45 Z" fill="#FFEBDD"></path><path d="M27 51 C23 30 34 17 50 17 C55 14 60 13.5 63 14.5 C61 15.5 60 16.5 59.5 18 C70 21 77 31 73.5 49 C72 44 70 40.5 67 38 C66 40.5 64 42 61.5 43 C62 40.5 61.5 38 60.5 36.5 C55 39.5 48.5 41.5 42 42.5 C43 40.5 43 38.5 42.5 37 C37 40.5 32 45 29 51 C28.5 50.5 27.8 50.5 27 51 Z" fill="#5A4038"></path></g><g stroke="#6B4A3E" stroke-width="2" fill="none"><circle cx="40.5" cy="56.5" r="7.8"></circle><circle cx="59.5" cy="56.5" r="7.8"></circle></g></svg></span>鍇鍇</a>
</div>
<a href="Main.dc.html" aria-label="病房" style="position: absolute; left: 50%; top: 0; margin-left: -40px; width: 80px; height: 80px; border-radius: 50%; background: #F7B6C2; border: 3px solid #8A4B36; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: #4A2C22; text-decoration: none; font-size: 12px; font-weight: 900"><svg width="38" height="34" viewBox="0 0 60 54" aria-hidden="true"><g stroke="#8A4B36" stroke-width="2.4"><circle cx="13" cy="13" r="8" fill="#E8B07A"></circle><circle cx="47" cy="13" r="8" fill="#E8B07A"></circle><circle cx="30" cy="30" r="22" fill="#E8B07A"></circle></g><circle cx="13" cy="13" r="4" fill="#F7C9C0"></circle><circle cx="47" cy="13" r="4" fill="#F7C9C0"></circle><ellipse cx="30" cy="38" rx="7.5" ry="5.5" fill="#FFE7C7"></ellipse><ellipse cx="30" cy="35.5" rx="2.4" ry="1.7" fill="#5A3A2E"></ellipse><circle cx="21" cy="30" r="2.4" fill="#4A2C22"></circle><circle cx="39" cy="30" r="2.4" fill="#4A2C22"></circle></svg>病房</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: 'grocery',
      owner: '又又',
      draft: '',
      nextId: 7,
      lists: {
        grocery: [
          { id: 1, name: '雞蛋', by: '又又', done: false },
          { id: 2, name: '牛奶', by: '鍇鍇', done: false },
          { id: 3, name: '青菜', by: '又又', done: true },
          { id: 4, name: '豆腐', by: '鍇鍇', done: false }
        ],
        stuff: [
          { id: 5, name: '護手霜', by: '又又', done: false },
          { id: 6, name: '刮鬍刀片', by: '鍇鍇', done: false }
        ]
      }
    };
  }
  updateList(fn) {
    const lists = Object.assign({}, this.state.lists);
    lists[this.state.tab] = fn(lists[this.state.tab]);
    this.setState({ lists: lists });
  }
  renderVals() {
    const st = this.state;
    const list = st.lists[st.tab];
    const pill = (on, color) => 'height: 40px; border-radius: 12px; border: none; font-family: \'Noto Sans TC\', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; background: ' + (on ? color : 'transparent') + '; color: ' + (on ? '#FFFFFF' : '#4A2C22');
    const chip = (on, color) => 'height: 32px; padding: 0 14px; border-radius: 999px; font-family: \'Noto Sans TC\', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; border: 2px solid ' + color + '; background: ' + (on ? color : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : color);
    const colorOf = (who) => (who === '又又' ? '#C2416A' : '#2F63A6');
    const done = list.filter((x) => x.done).length;
    return {
      tabs: [
        { key: 'grocery', label: '買菜 (' + st.lists.grocery.length + ')' },
        { key: 'stuff', label: '日用品 (' + st.lists.stuff.length + ')' }
      ].map((t) => ({ label: t.label, on: st.tab === t.key, style: pill(st.tab === t.key, '#4A2C22'), pick: () => this.setState({ tab: t.key }) })),
      owners: ['又又', '鍇鍇'].map((w) => ({ label: w, on: st.owner === w, style: chip(st.owner === w, colorOf(w)), pick: () => this.setState({ owner: w }) })),
      items: list.map((x) => ({
        name: x.name,
        by: x.by,
        done: x.done,
        cid: 'item-' + x.id,
        nameStyle: 'flex: 1; font-size: 15px; font-weight: 500; cursor: pointer; ' + (x.done ? 'color: #9A8C93; text-decoration: line-through' : 'color: #4A2C22'),
        tagStyle: 'flex-shrink: 0; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; color: #FFFFFF; background: ' + colorOf(x.by),
        toggle: () => this.updateList((l) => l.map((y) => (y.id === x.id ? Object.assign({}, y, { done: !y.done }) : y)))
      })),
      isEmpty: list.length === 0,
      doneText: '已買 ' + done + ' / ' + list.length,
      draft: st.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      add: () => {
        const v = st.draft.trim();
        if (!v) return;
        const id = st.nextId;
        this.updateList((l) => l.concat([{ id: id, name: v, by: st.owner, done: false }]));
        this.setState({ draft: '', nextId: id + 1 });
      },
      clearDone: () => this.updateList((l) => l.filter((y) => !y.done))
    };
  }
}
</script>
</body>
</html>
