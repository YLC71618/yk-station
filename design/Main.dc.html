<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { coins: { yo: 120, kai: 85 }, sick: true, water: 40, clean: 35, mood: 60, energy: 80, toast: '' };
  }
  componentWillUnmount() { clearTimeout(this._t); }
  say(msg) {
    this.setState({ toast: msg });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toast: '' }), 2600);
  }
  treat(label, cost, gain) {
    const st = this.state;
    if (!st.sick) { this.say('熊熊現在很健康，不用治療'); return; }
    if (st.coins.kai < cost) { this.say('鍇鍇的站幣不夠，快去做任務賺錢！'); return; }
    this.setState({
      coins: { yo: st.coins.yo, kai: st.coins.kai - cost },
      sick: false,
      clean: Math.min(100, st.clean + gain),
      mood: Math.min(100, st.mood + 15)
    });
    this.say('手手龜裂是鍇鍇造成的，由鍇鍇付 ' + cost + ' 站幣（' + label + '）。熊熊好多了！');
  }
  renderVals() {
    const st = this.state;
    const bar = (pct, color) => 'height: 100%; border-radius: 999px; width: ' + pct + '%; background: ' + color;
    const tag = (who) => 'width: 40px; text-align: center; flex-shrink: 0; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 0; color: #FFFFFF; background: ' + (who === '又又' ? '#C2416A' : who === '鍇鍇' ? '#2F63A6' : '#8A4B36');
    const vitals = [
      { label: '水分', value: st.water, color: '#6FA8E6', owner: '又又' },
      { label: '清潔', value: st.clean, color: '#7CC6A4', owner: '鍇鍇' },
      { label: '心情', value: st.mood, color: '#F38BA0', owner: '一起' },
      { label: '體力', value: st.energy, color: '#F2B266', owner: '一起' }
    ].map((v) => ({ label: v.label, value: v.value, owner: v.owner, barStyle: bar(v.value, v.color), ownerStyle: tag(v.owner) }));
    return {
      coinsYo: st.coins.yo,
      coinsKai: st.coins.kai,
      sick: st.sick,
      healthy: !st.sick,
      statusText: st.sick ? '生病中：手手龜裂 · 輕症' : '健康 · 心情很好',
      statusStyle: 'font-size: 13px; font-weight: 700; border-radius: 999px; padding: 4px 12px; color: #FFFFFF; background: ' + (st.sick ? '#C2416A' : '#3F8A69'),
      vitals: vitals,
      treatments: [
        { label: '吃藥', cost: 30, gain: 30 },
        { label: '打針', cost: 80, gain: 50 },
        { label: '住院', cost: 200, gain: 65 }
      ].map((t) => ({ label: t.label, cost: t.cost, use: () => this.treat(t.label, t.cost, t.gain) })),
      showToast: !!st.toast,
      toast: st.toast
    };
  }
}
</script>
</body>
</html>
